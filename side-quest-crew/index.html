<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Side Quest Crew</title>
<meta name="description" content="One quest. One month. Done together. Vote on the next challenge, join the crew, track your progress and climb the leaderboard.">
<meta property="og:title" content="Side Quest Crew">
<meta property="og:description" content="One quest. One month. Done together.">
<meta name="theme-color" content="#1B1433">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231B1433'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23FF6A2A' stroke-width='6'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23FFC23D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: night-sky hero holding the live quest "broadcast" card; light content bands below; quest, board and dashboard are hash routes */
:root{
  --bg:#F6F4FF; --surface:#FFFFFF; --soft:#EEEAFB; --ink:#1B1433; --ink-2:#3B3360; --muted:#6B6489; --line:rgba(27,20,51,.10);
  --night:#1B1433; --night-2:#2D1E5F; --on-night:#F4F1FF; --on-night-2:#BDB5E0;
  --quest:#FF6A2A; --quest-hover:#E8551A; --on-quest:#FFFFFF; --xp:#FFC23D; --mint:#14B892;
  --health:#16A34A; --wealth:#B7791F; --money:#0D9488; --rel:#DB2777; --career:#2563EB;
  --shadow:0 18px 44px -26px rgba(27,20,51,.45); --radius:20px;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --body:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F0B1F;--surface:#1A1433;--soft:#241C45;--ink:#F4F1FF;--ink-2:#D6D0F0;--muted:#A49DC6;--line:rgba(255,255,255,.10);--night:#0A0716;--night-2:#1E1442;--quest:#FF7A40;--quest-hover:#FF9160;--health:#4ADE80;--wealth:#F5C45E;--money:#2DD4BF;--rel:#F472B6;--career:#60A5FA;--shadow:0 18px 44px -24px rgba(0,0,0,.75);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F0B1F;--surface:#1A1433;--soft:#241C45;--ink:#F4F1FF;--ink-2:#D6D0F0;--muted:#A49DC6;--line:rgba(255,255,255,.10);--night:#0A0716;--night-2:#1E1442;--quest:#FF7A40;--quest-hover:#FF9160;--health:#4ADE80;--wealth:#F5C45E;--money:#2DD4BF;--rel:#F472B6;--career:#60A5FA;--shadow:0 18px 44px -24px rgba(0,0,0,.75);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--quest)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.08;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 20px;font:700 15px var(--body);cursor:pointer;text-decoration:none;background:var(--quest);color:var(--on-quest);transition:transform .15s,background .15s;white-space:nowrap}
.btn:hover{background:var(--quest-hover)} .btn:active{transform:translateY(1px)} .btn[disabled]{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.btn.ghost:hover{background:rgba(127,127,127,.08)}
.btn.sm{padding:8px 14px;font-size:13.5px;border-radius:11px}
.btn.done{background:var(--mint)}
.btn.discord{background:#5865F2} .btn.discord:hover{background:#4752C4}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 11.5px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--ink-2)}
.cat-Health{--c:var(--health)} .cat-Wealth{--c:var(--wealth)} .cat-Money{--c:var(--money)} .cat-Relationships{--c:var(--rel)} .cat-Career{--c:var(--career)}
.chip.cat{background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.status-registration{background:color-mix(in srgb,var(--xp) 25%,transparent);color:#7A5300}
.status-live{background:color-mix(in srgb,var(--mint) 20%,transparent);color:var(--mint)}
.status-done{background:var(--soft);color:var(--muted)}
:root[data-theme="dark"] .status-registration{color:var(--xp)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .status-registration{color:var(--xp)}}
.muted{color:var(--muted)} .small{font-size:13.5px}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--quest);outline-offset:2px}

/* header */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--night) 92%,transparent);backdrop-filter:blur(10px);color:var(--on-night)}
.nav .wrap{display:flex;align-items:center;gap:18px;height:64px}
.logo{display:flex;align-items:center;gap:10px;color:var(--on-night);text-decoration:none;font:800 18px var(--display)}
.logo svg{width:30px;height:30px}
.nav nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto}
.nav nav a{color:var(--on-night-2);text-decoration:none;font-weight:600;font-size:14.5px;padding:8px 12px;border-radius:10px;white-space:nowrap}
.nav nav a:hover,.nav nav a.on{color:#fff;background:rgba(255,255,255,.08)}
@media (max-width:760px){.nav nav a.hide-sm{display:none}.nav .wrap{gap:10px}.nav nav a{padding:8px 9px}}

/* hero */
.hero{background:radial-gradient(1200px 500px at 85% -10%,rgba(255,106,42,.28),transparent 60%),radial-gradient(900px 500px at 0% 120%,rgba(20,184,146,.18),transparent 60%),linear-gradient(180deg,var(--night),var(--night-2));color:var(--on-night);padding-block:clamp(40px,7vw,80px);position:relative;overflow:hidden}
.stars{position:absolute;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(1.5px 1.5px at 10% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 55% 30%,#fff,transparent),radial-gradient(1px 1px at 75% 80%,#fff,transparent),radial-gradient(1.5px 1.5px at 90% 15%,#fff,transparent),radial-gradient(1px 1px at 45% 90%,#fff,transparent)}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(24px,4vw,56px);align-items:center}
.hero h1{font-size:clamp(40px,6.4vw,76px);font-weight:800}
.hero h1 em{font-style:normal;color:var(--quest)}
.hero p.lead{font-size:clamp(17px,1.6vw,19px);color:var(--on-night-2);max-width:32em;margin:18px 0 26px}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap}
.hero .btn.ghost{color:var(--on-night)}
.hero .broadcast .btn.ghost{color:var(--ink,inherit)}
.goal{margin-top:26px;display:flex;align-items:center;gap:12px;color:var(--on-night-2);font-size:14px}
.goal .meter{flex:1;max-width:240px;height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
.goal .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--quest),var(--xp))}
.broadcast{background:var(--surface);color:var(--ink);border-radius:26px;padding:24px;box-shadow:0 40px 80px -40px rgba(0,0,0,.7);position:relative}
.broadcast .on-air{position:absolute;top:-12px;left:22px;background:var(--quest);color:#fff;font:800 11px var(--body);letter-spacing:.14em;text-transform:uppercase;padding:6px 12px;border-radius:999px;display:flex;align-items:center;gap:6px}
.broadcast .on-air::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.broadcast .emoji{font-size:44px;line-height:1}
.broadcast h2{font-size:28px;margin:10px 0 6px}
.broadcast p{color:var(--muted);margin:0 0 16px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.fact{background:var(--soft);border-radius:14px;padding:10px 12px}
.fact b{display:block;font:800 20px var(--display)}
.fact span{font-size:12px;color:var(--muted)}

/* sections */
.sec{padding-block:clamp(48px,7vw,88px)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.eyebrow{font:800 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--quest)}
.sec h2{font-size:clamp(30px,4vw,44px);font-weight:800;margin-top:8px}
.sec-head p{color:var(--muted);max-width:52ch;margin:8px 0 0}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;counter-reset:s}
.step{background:var(--surface);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);position:relative;min-width:0}
.step .ic{font-size:28px}
.step h3{font-size:19px;margin:10px 0 6px}
.step p{margin:0;color:var(--muted);font-size:14.5px}
.step::after{counter-increment:s;content:"0" counter(s);position:absolute;top:14px;right:16px;font:800 14px var(--display);color:var(--line)}
:root .step::after{color:color-mix(in srgb,var(--ink) 20%,transparent)}

/* vote */
.poll{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border-radius:16px;padding:14px 16px;border:2px solid transparent;box-shadow:var(--shadow);position:relative;overflow:hidden}
.opt.mine{border-color:var(--quest)}
.opt .fill{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--c, var(--quest)) 10%,transparent);pointer-events:none;transition:width .5s}
.opt > *{position:relative}
.opt .e{font-size:28px}
.opt b{display:block;font-size:16px}
.opt .votes{font-size:13px;color:var(--muted)}
.poll-meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-top:12px}

/* board */
.board{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.board-scroll{overflow-x:auto}
table.b{width:100%;border-collapse:collapse;min-width:560px}
.b th{font:700 11.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
.b td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:15px}
.b tr:last-child td{border-bottom:0}
.rank{width:44px;height:30px;display:grid;place-items:center;border-radius:9px;font:800 15px var(--display);background:var(--soft)}
.r1 .rank{background:var(--xp);color:#3A2A00} .r2 .rank{background:#D6DAE6;color:#2A2F3E} .r3 .rank{background:#E7B48A;color:#3E2410}
.xp{font:800 17px var(--display);color:var(--quest)}
.pbar{height:8px;border-radius:8px;background:var(--soft);overflow:hidden;min-width:90px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--quest),var(--xp));border-radius:8px}
.empty{padding:32px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* ideas */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:700 14px var(--body);cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.idea{background:var(--surface);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--c);text-decoration:none;color:var(--ink);min-width:0}
.idea .e{font-size:30px}
.idea b{font-size:17px;font-family:var(--display)}
.idea p{margin:0;color:var(--muted);font-size:14px;flex:1}

/* community */
.community{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.cbox{border-radius:var(--radius);padding:26px;background:var(--night);color:var(--on-night)}
.cbox.alt{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.cbox h3{font-size:24px;margin:8px 0 8px}
.cbox p{margin:0 0 16px;opacity:.85}

/* faq */
.faq{display:grid;gap:10px;max-width:820px}
.faq details{background:var(--surface);border-radius:14px;padding:16px 18px;border:1px solid var(--line)}
.faq summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--quest);font-weight:800}
.faq details[open] summary::after{content:"–"}
.faq p{margin:10px 0 0;color:var(--muted)}

/* quest page */
.qhead{background:linear-gradient(180deg,var(--night),var(--night-2));color:var(--on-night);padding-block:clamp(36px,6vw,64px)}
.qhead .e{font-size:56px;line-height:1}
.qhead h1{font-size:clamp(36px,5.4vw,60px);margin:12px 0 10px}
.qhead p{color:var(--on-night-2);max-width:44em;margin:0 0 20px;font-size:18px}
.qmeta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.qmeta .chip{background:rgba(255,255,255,.1);color:var(--on-night)}
.qgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.panel{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;min-width:0}
.panel h3{font-size:22px;margin-bottom:12px}
.week{margin-top:16px}
.week h4{margin:0 0 8px;font:800 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;cursor:pointer}
.task:hover{background:var(--soft)}
.task.locked{cursor:default} .task.locked:hover{background:none}
.task input{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:1px 0 0;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:inherit}
.task input:checked{background:var(--mint);border-color:var(--mint)}
.task input:checked::after{content:"";width:12px;height:7px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.task b{display:block;font-weight:700;font-size:15px}
.task.isdone b{text-decoration:line-through;color:var(--muted)}
.task span{font-size:13.5px;color:var(--muted)}
.task a{font-size:13.5px}
ul.rules{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--ink-2)}
.score-card{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.score-card .fact b{color:var(--quest)}
form.f{display:grid;gap:12px}
label.l{display:grid;gap:6px;font-size:13.5px;font-weight:700;color:var(--ink-2)}
input.i,select.i,textarea.i{font:inherit;color:var(--ink);width:100%;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 13px}
input.i:focus,textarea.i:focus,select.i:focus{outline:none;border-color:var(--quest);box-shadow:0 0 0 3px color-mix(in srgb,var(--quest) 20%,transparent)}
textarea.i{min-height:64px;resize:vertical}
.msg{margin:0;font-size:14px;color:var(--muted)} .msg.ok{color:var(--mint);font-weight:700} .msg.err{color:#DC2626;font-weight:700}
.reslist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.reslist a{display:block;padding:10px 12px;border-radius:12px;background:var(--soft);text-decoration:none;color:var(--ink);font-weight:600;font-size:14.5px}
.reslist a:hover{color:var(--quest)}
.logs{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px;font-size:13.5px;color:var(--muted)}

/* me */
.myq{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px;border-radius:16px;background:var(--soft);text-decoration:none;color:var(--ink)}
.myq .e{font-size:34px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,7,22,.6);display:grid;place-items:center;padding:16px;z-index:50}
.modal .panel{width:min(440px,100%);max-height:92vh;overflow:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:16px}
.seg button{border:0;background:none;padding:9px;border-radius:9px;font:700 14px var(--body);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px -4px rgba(0,0,0,.3)}
.x{position:absolute;top:12px;right:12px;border:0;background:var(--soft);width:34px;height:34px;border-radius:10px;cursor:pointer;color:var(--ink);font-size:18px}
footer{padding-block:40px 56px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--muted)}

@media (max-width:920px){
  .hero-grid,.qgrid,.community{grid-template-columns:minmax(0,1fr)}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  .steps{grid-template-columns:minmax(0,1fr)}
  .facts,.score-card{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .fact{padding:8px}
  .fact b{font-size:17px}
  .opt{grid-template-columns:auto minmax(0,1fr)} .opt .btn{grid-column:1/-1}
  .myq{grid-template-columns:auto minmax(0,1fr)} .myq .btn{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a class="logo" href="#/"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="22" fill="none" stroke="#FF6A2A" stroke-width="7"/><circle cx="32" cy="32" r="8" fill="#FFC23D"/></svg>Side Quest Crew</a>
    <nav id="nav">
      <a href="#/" data-r="home" class="hide-sm">This month</a>
      <a href="#/vote" data-r="vote" class="hide-sm">Vote</a>
      <a href="#/board" data-r="board">Billboard</a>
      <a href="#/ideas" data-r="ideas" class="hide-sm">Ideas</a>
      <a href="#/me" data-r="me" id="navMe">Join</a>
    </nav>
  </div>
</header>

<main id="view"></main>

<footer><div class="wrap"><span>Side Quest Crew · started by <a href="https://www.threads.com/@yashujambu" target="_blank" rel="noopener">@yashujambu</a></span><span id="footDiscord"></span></div></footer>

<div class="modal" id="authModal" hidden>
  <div class="panel" style="position:relative" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <button class="x" type="button" id="authClose" aria-label="Close">×</button>
    <h3 id="authTitle" style="font-size:26px;margin:4px 40px 6px 0">Join the crew</h3>
    <p class="muted small" id="authSub" style="margin:0 0 14px">Free. Your first name and country show on the billboard, never your email.</p>
    <div class="seg"><button type="button" id="segJoin" class="on">New here</button><button type="button" id="segLogin">Log in</button></div>
    <form class="f" id="authForm" novalidate>
      <label class="l" id="fName">First name<input class="i" id="aName" autocomplete="given-name" maxlength="40"></label>
      <label class="l">Email<input class="i" id="aEmail" type="email" autocomplete="email" inputmode="email" maxlength="200"></label>
      <label class="l">Password<input class="i" id="aPass" type="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters"></label>
      <label class="l" id="fCountry">Country<input class="i" id="aCountry" autocomplete="country-name" maxlength="40" placeholder="Optional"></label>
      <button class="btn" type="submit" id="aBtn">Join the crew</button>
      <p class="msg" id="aMsg" role="status" aria-live="polite"></p>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* =================== SETTINGS =================== */
const CFG = {
  supabaseUrl: "https://ctezcrglzcjxdkagnoyy.supabase.co",
  supabaseKey: "sb_publishable_WM7az_Nye-qOMmgWDOJRVg_vITL_Zse",
  discord: "",                 // paste the Discord invite link, e.g. "https://discord.gg/abc123"
  crewGoal: 1000,              // "1,000 true fans"
  zoomNote: "Once a month, on a Sunday. The link is posted in the Discord a week before.",
};
const CATS = ["Health","Wealth","Money","Relationships","Career"];

/* =================== HELPERS =================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => d ? new Date(d+"T00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"}) : "";
const daysTo = d => Math.ceil((new Date(d+"T00:00") - new Date(new Date().toDateString())) / 864e5);
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}} };
let sb = null; try { sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth:{ persistSession:false } }); } catch(e){}
let TOKEN = store.get("sq_token"), ME = null, QUESTS = [], POLL = null, RESULTS = {}, COUNTS = {}, pendingJoin = null, ideaTab = "All";
const ERR = { email_taken:"That email already has an account. Log in instead.", password_short:"Password needs at least 6 characters.", "ERR:bad_login":"Email or password is wrong.", "ERR:locked":"Too many tries. Please wait 15 minutes.", not_logged_in:"Please log in again.", not_open:"This quest isn't open for sign-ups.", not_live:"Tasks unlock when the quest starts.", not_enrolled:"Join the quest first.", poll_closed:"Voting has closed." };
const errText = e => { const m = (e && (e.message || e)) + ""; for (const k in ERR) if (m.includes(k)) return ERR[k]; return "Something went wrong. Please try again."; };

const current = () => QUESTS.find(q => q.status === "live") || QUESTS.find(q => q.status === "registration") || QUESTS.filter(q => q.status === "done").sort((a,b)=>(b.ends_on||"").localeCompare(a.ends_on||""))[0];
const enrolled = slug => ME && ME.enrollments.find(e => e.quest_slug === slug);
const statusLabel = q => q.status === "registration" ? "Registration open" : q.status === "live" ? "Live now" : q.status === "done" ? "Finished" : "Idea";

/* =================== DATA =================== */
async function loadPublic(){
  if (!sb) return;
  const [q, p, c] = await Promise.all([
    sb.from("sq_quests").select("*").order("starts_on", { ascending:true, nullsFirst:false }),
    sb.from("sq_polls").select("*").eq("status","open").order("id",{ascending:false}).limit(1),
    sb.rpc("sq_quest_counts")
  ]);
  QUESTS = q.data || []; POLL = (p.data || [])[0] || null;
  COUNTS = Object.fromEntries((c.data || []).map(r => [r.quest_slug, Number(r.members)]));
  if (POLL){ const r = await sb.rpc("sq_poll_results", { p_poll: POLL.id }); RESULTS = Object.fromEntries((r.data || []).map(x => [x.option_key, Number(x.votes)])); }
}
async function loadMe(){
  if (!TOKEN || !sb){ ME = null; return; }
  const { data, error } = await sb.rpc("sq_me", { p_token: TOKEN });
  if (error){ TOKEN = null; store.set("sq_token", null); ME = null; return; }
  ME = data;
}
async function board(slug){ if (!sb) return []; const { data } = await sb.rpc("sq_leaderboard", { p_slug: slug }); return data || []; }

/* =================== PIECES =================== */
function broadcastCard(q){
  if (!q) return `<div class="broadcast"><h2>Next quest coming soon</h2><p>Vote below to choose it.</p></div>`;
  const n = COUNTS[q.slug] || 0, d = q.starts_on ? daysTo(q.starts_on) : null, mine = enrolled(q.slug);
  const third = q.status === "registration" && d > 0 ? [d, d === 1 ? "day to start" : "days to start"] : q.status === "live" && q.ends_on ? [Math.max(0, daysTo(q.ends_on)), "days left"] : [((q.content.tasks||[]).length) || "–", "tasks"];
  return `<div class="broadcast cat-${esc(q.category)}">
    <span class="on-air">This month's quest</span>
    <div style="display:flex;justify-content:space-between;align-items:start;gap:10px;margin-top:6px"><span class="emoji">${esc(q.emoji||"🎯")}</span><span class="chip status-${q.status}">${statusLabel(q)}</span></div>
    <h2>${esc(q.title)}</h2>
    <p>${esc(q.summary||"")}</p>
    <div class="facts">
      <div class="fact"><b class="tnum">${n}</b><span>crew joined</span></div>
      <div class="fact"><b class="tnum">${fmt(q.starts_on)||"TBC"}</b><span>${q.ends_on ? "to " + fmt(q.ends_on) : "start"}</span></div>
      <div class="fact"><b class="tnum">${third[0]}</b><span>${third[1]}</span></div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      ${mine ? `<a class="btn done" href="#/quest/${q.slug}">You're in · open quest →</a>` : `<button class="btn" data-join="${q.slug}" type="button">Join this quest</button>`}
      <a class="btn ghost" href="#/quest/${q.slug}">See the plan</a>
    </div>
  </div>`;
}
function boardTable(rows, q, limit){
  if (!rows.length) return `<div class="empty"><b>No one on the board yet</b>Join the quest and be the first name up here.</div>`;
  const myName = ME && ME.name ? ME.name.split(" ")[0] : null;
  return `<div class="board-scroll"><table class="b"><thead><tr><th>#</th><th>Crew member</th><th>XP</th><th>Tasks</th><th>Check-ins</th><th>Last active</th></tr></thead><tbody>
    ${rows.slice(0, limit || 100).map(r => `<tr class="r${r.rank}"><td><span class="rank">${r.rank}</span></td><td><b>${esc(r.display_name)}</b>${r.country?` <span class="muted small">· ${esc(r.country)}</span>`:""}${myName && r.display_name === myName ? ' <span class="chip" style="padding:2px 7px">you</span>':""}</td>
      <td class="xp tnum">${r.score}</td><td><div class="pbar" title="${r.tasks_done}/${r.total_tasks}"><i style="width:${r.total_tasks? r.tasks_done/r.total_tasks*100:0}%"></i></div><span class="small muted tnum">${r.tasks_done}/${r.total_tasks}</span></td>
      <td class="tnum">${r.logs}</td><td class="small muted">${r.last_active ? fmt(r.last_active) : "–"}</td></tr>`).join("")}
  </tbody></table></div>`;
}
function pollBlock(){
  if (!POLL) return `<div class="empty"><b>No vote running right now</b>The next vote opens near the end of the month.</div>`;
  const total = Object.values(RESULTS).reduce((a,b)=>a+b,0), mine = ME && ME.votes ? ME.votes[String(POLL.id)] : null;
  return `<div class="poll">${POLL.options.map(o => { const v = RESULTS[o.key]||0, pct = total ? Math.round(v/total*100) : 0;
    return `<div class="opt cat-${esc(o.category)} ${mine===o.key?"mine":""}" style="--c:var(--${({Health:"health",Wealth:"wealth",Money:"money",Relationships:"rel",Career:"career"})[o.category]||"quest"})"><span class="fill" style="width:${pct}%"></span>
      <span class="e">${esc(o.emoji||"🎯")}</span><div><b>${esc(o.title)}</b><span class="votes"><span class="chip cat" style="padding:2px 8px;font-size:10.5px">${esc(o.category)}</span> · <span class="tnum">${v}</span> vote${v===1?"":"s"} · ${pct}%</span></div>
      <button class="btn sm ${mine===o.key?"done":""}" type="button" data-vote="${esc(o.key)}">${mine===o.key?"Your vote ✓":"Vote"}</button></div>`; }).join("")}</div>
    <div class="poll-meta"><span>🗳️ ${total} vote${total===1?"":"s"} so far</span>${POLL.closes_on?`<span>Closes ${fmt(POLL.closes_on)}</span>`:""}<span>One vote per member. You can change it until it closes.</span></div>`;
}
function ideasBlock(){
  const list = QUESTS.filter(q => ideaTab === "All" || q.category === ideaTab);
  return `<div class="tabs">${["All",...CATS].map(c => `<button class="tab ${c===ideaTab?"on":""}" type="button" data-tab="${c}">${c}</button>`).join("")}</div>
  <div class="ideas">${list.map(q => `<a class="idea cat-${esc(q.category)}" href="#/quest/${q.slug}"><span class="e">${esc(q.emoji||"🎯")}</span><span class="chip cat" style="align-self:start">${esc(q.category)}</span><b>${esc(q.title)}</b><p>${esc(q.summary||"")}</p>${q.status!=="idea"?`<span class="chip status-${q.status}" style="align-self:start">${statusLabel(q)}</span>`:""}</a>`).join("")}</div>`;
}
function discordBtn(cls){ return CFG.discord ? `<a class="btn discord ${cls||""}" href="${esc(CFG.discord)}" target="_blank" rel="noopener">Join the Discord</a>` : `<span class="btn discord ${cls||""}" aria-disabled="true" style="opacity:.6;cursor:default">Discord opens soon</span>`; }

  const done = e ? e.done_tasks : [], weeks = [...new Set(tasks.map(t => t.week))];
  const myRow = e && ME ? rows.find(r => r.display_name === ME.name.split(" ")[0]) : null;
  const joinBtn = (q.status === "registration" || live) ? (e ? `<span class="btn done">You're in ✓</span>` : `<button class="btn" type="button" data-join="${slug}">Join this quest</button>`) : q.status === "idea" ? `<a class="btn" href="#/vote">Vote for quests</a>` : "";
  $("#view").innerHTML = `
  <section class="qhead"><div class="wrap">
    <span class="e">${esc(q.emoji||"🎯")}</span>
    <h1>${esc(q.title)}</h1>
    <p>${esc(q.summary||"")}</p>
    <div class="qmeta"><span class="chip">${esc(q.category)}</span><span class="chip">${statusLabel(q)}</span>${q.starts_on?`<span class="chip">${fmt(q.starts_on)} – ${fmt(q.ends_on)}</span>`:""}<span class="chip">${COUNTS[slug]||0} crew</span>${tasks.length?`<span class="chip">${tasks.length} tasks</span>`:""}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">${joinBtn}${discordBtn()}</div>
  </div></section>
  <section class="sec" style="padding-top:28px"><div class="wrap qgrid">
    <div style="display:grid;gap:20px">
      ${c.why ? `<div class="panel"><h3>Why this quest</h3><p style="margin:0;color:var(--ink-2)">${esc(c.why)}</p>${c.note?`<p class="small" style="margin:12px 0 0;color:var(--muted)">⚠️ ${esc(c.note)}</p>`:""}</div>` : (c.note ? `<div class="panel"><p style="margin:0">⚠️ ${esc(c.note)}</p></div>` : "")}
      ${tasks.length ? `<div class="panel"><h3>The plan</h3><p class="small muted" style="margin:0">${live ? (e ? "Tick tasks off as you go. Each one is 10 XP." : "Join the quest to start ticking these off.") : "Tasks unlock when the quest starts."}</p>
        ${weeks.map(w => `<div class="week"><h4>${esc(w)}</h4>${tasks.filter(t => t.week === w).map(t => { const on = done.includes(t.id), can = live && e;
          return `<label class="task ${can?"":"locked"} ${on?"isdone":""}"><input type="checkbox" data-task="${esc(t.id)}" ${on?"checked":""} ${can?"":"disabled"}><span><b>${esc(t.title)}</b>${t.detail?`<span>${esc(t.detail)}</span>`:""}${t.link?` <a href="${esc(t.link)}" target="_blank" rel="noopener">Open →</a>`:""}</span></label>`; }).join("")}</div>`).join("")}</div>`
      : `<div class="panel"><h3>The plan</h3><p class="muted" style="margin:0">This is an idea in the quest library. If the crew votes for it, it gets dates and a full week-by-week plan.</p></div>`}
      <div class="panel"><h3>Billboard</h3><div class="board" style="box-shadow:none">${boardTable(rows, q)}</div></div>
    </div>
    <div style="display:grid;gap:20px">
      ${e ? `<div class="panel"><h3>My progress</h3>
        <div class="score-card"><div class="fact"><b class="tnum">${e.score}</b><span>XP</span></div><div class="fact"><b class="tnum">${done.length}/${tasks.length}</b><span>tasks</span></div><div class="fact"><b class="tnum">${myRow ? "#" + myRow.rank : "–"}</b><span>rank</span></div></div>
        <div class="pbar" style="height:10px"><i style="width:${tasks.length ? done.length/tasks.length*100 : 0}%"></i></div>
        ${live ? `<form class="f" id="logForm" style="margin-top:16px" novalidate>
          <b>Daily check-in ${e.logged_today ? '<span class="chip status-live" style="margin-left:6px">Done today ✓</span>' : '<span class="muted small">(+5 XP)</span>'}</b>
          ${c.metric ? `<label class="l">${esc(c.metric.label)}${c.metric.unit?` (${esc(c.metric.unit)})`:""}<input class="i" id="logVal" type="number" inputmode="decimal" min="0" step="any"></label>` : ""}
          <label class="l">What did you do today?<textarea class="i" id="logNote" maxlength="300" placeholder="One line is enough"></textarea></label>
          <button class="btn" type="submit">${e.logged_today ? "Update today's check-in" : "Log today"}</button>
          <p class="msg" id="logMsg" role="status" aria-live="polite"></p>

    <h2 style="font-size:28px">My quests</h2>

      : `<div class="panel empty"><b>No quests yet</b>${cur ? `Join ${esc(cur.title)} to get started.` : "The next quest is coming soon."}</div>`}
    ${POLL ? `<div class="panel" style="margin-top:8px"><h3>${esc(POLL.title)}</h3><p class="muted small" style="margin:0 0 12px">${ME.votes && ME.votes[String(POLL.id)] ? "You've voted. You can change it until it closes." : "You haven't voted yet."}</p><a class="btn ghost sm" href="#/vote">Go to the vote</a></div>` : ""}

/* =================== ROUTER =================== */
async function route(){
  const h = location.hash.replace(/^#\/?/, ""), [r, arg] = h.split("/");
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.r === (r || "home") || (r === "quest" && a.dataset.r === "home")));
  $("#navMe").textContent = ME ? "My quests" : "Join";
  if (r === "quest") await vQuest(arg);
  else if (r === "board") await vBoard(arg);
  else if (r === "me") await vMe();
  else { await vHome(r === "vote" ? "vote" : r === "ideas" ? "ideas" : null); if (r !== "vote" && r !== "ideas") window.scrollTo(0,0); return; }
  window.scrollTo(0,0);
}
async function refresh(){ await Promise.all([loadPublic(), loadMe()]); await route(); }

let authMode = "join";
function openAuth(mode){
  authMode = mode || "join"; $("#authModal").hidden = false; setMode(authMode); setTimeout(() => (authMode==="join"?$("#aName"):$("#aEmail")).focus(), 30);
}
function setMode(m){
  authMode = m; $("#segJoin").classList.toggle("on", m==="join"); $("#segLogin").classList.toggle("on", m==="login");
  $("#fName").hidden = $("#fCountry").hidden = m !== "join";
  $("#authTitle").textContent = m === "join" ? "Join the crew" : "Welcome back";
  $("#aBtn").textContent = m === "join" ? (pendingJoin ? "Join and enter the quest" : "Join the crew") : "Log in";
  $("#aPass").autocomplete = m === "join" ? "new-password" : "current-password";
  $("#aMsg").textContent = "";
}
$("#segJoin").onclick = () => setMode("join"); $("#segLogin").onclick = () => setMode("login");
$("#authClose").onclick = () => { $("#authModal").hidden = true; pendingJoin = null; };
$("#authModal").addEventListener("click", e => { if (e.target.id === "authModal"){ $("#authModal").hidden = true; pendingJoin = null; } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#authModal").hidden){ $("#authModal").hidden = true; pendingJoin = null; } });
$("#authForm").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = $("#aMsg"), email = $("#aEmail").value.trim(), pass = $("#aPass").value, name = $("#aName").value.trim();
  const say = (t, c) => { msg.textContent = t; msg.className = "msg " + (c||""); };
  if (authMode === "join" && !name) return say("Please add your first name.", "err");
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return say("Please enter a valid email.", "err");
  if (pass.length < 6) return say("Password needs at least 6 characters.", "err");
  if (!sb) return say("Couldn't connect. Please refresh.", "err");
  $("#aBtn").disabled = true; say(authMode === "join" ? "Creating your account…" : "Logging in…");
  const res = authMode === "join"
    ? await sb.rpc("sq_register", { p_name: name, p_email: email, p_password: pass, p_country: $("#aCountry").value.trim() || null })
    : await sb.rpc("sq_login", { p_email: email, p_password: pass });
  $("#aBtn").disabled = false;
  if (res.error) return say(errText(res.error), "err");
  if (typeof res.data === "string" && res.data.startsWith("ERR:")) return say(errText(res.data), "err");
  TOKEN = res.data; store.set("sq_token", TOKEN);
  if (pendingJoin){ const j = await sb.rpc("sq_join", { p_token: TOKEN, p_slug: pendingJoin }); if (!j.error) location.hash = "#/quest/" + pendingJoin; pendingJoin = null; }
  $("#authModal").hidden = true; $("#authForm").reset();
  await refresh();
});

/* =================== ACTIONS =================== */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-join],[data-vote],[data-tab],[data-auth],#logout"); if (!t) return;
  if (t.dataset.auth){ openAuth(t.dataset.auth); return; }
  if (t.dataset.tab){ ideaTab = t.dataset.tab; $("#ideasBox").innerHTML = ideasBlock(); return; }
  if (t.id === "logout"){ if (sb && TOKEN) await sb.rpc("sq_logout", { p_token: TOKEN }); TOKEN = null; store.set("sq_token", null); ME = null; location.hash = "#/"; await refresh(); return; }
  if (t.dataset.join){
    if (!TOKEN){ pendingJoin = t.dataset.join; openAuth("join"); return; }
    t.disabled = true; const { error } = await sb.rpc("sq_join", { p_token: TOKEN, p_slug: t.dataset.join });
    if (error){ alertInline(t, errText(error)); t.disabled = false; return; }
    location.hash = "#/quest/" + t.dataset.join; await refresh(); return;
  }
  if (t.dataset.vote){
    if (!TOKEN){ openAuth("join"); return; }
    t.disabled = true; const { error } = await sb.rpc("sq_vote", { p_token: TOKEN, p_poll: POLL.id, p_option: t.dataset.vote });
    t.disabled = false; if (error){ alertInline(t, errText(error)); return; }
    await loadPublic(); await loadMe(); await vHome("vote");
  }
});
function alertInline(el, text){ let m = el.parentElement.querySelector(".msg.inline"); if (!m){ m = document.createElement("p"); m.className = "msg err inline"; el.parentElement.appendChild(m); } m.textContent = text; }
document.addEventListener("change", async e => {
  const t = e.target; if (!t.dataset.task) return;
  const slug = location.hash.split("/")[2]; t.disabled = true;
  const { error } = await sb.rpc("sq_set_task", { p_token: TOKEN, p_slug: slug, p_task: t.dataset.task, p_done: t.checked });
  if (error){ t.checked = !t.checked; t.disabled = false; return; }
  await loadMe(); await loadPublic(); await vQuest(slug);
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "logForm") return; e.preventDefault();
  const slug = location.hash.split("/")[2], msg = $("#logMsg"), v = $("#logVal") ? $("#logVal").value : "", note = $("#logNote").value.trim();
  if (!note && v === ""){ msg.textContent = "Add a number or one line about today."; msg.className = "msg err"; return; }
  const { error } = await sb.rpc("sq_log", { p_token: TOKEN, p_slug: slug, p_value: v === "" ? null : Number(v), p_note: note || null });
  if (error){ msg.textContent = errText(error); msg.className = "msg err"; return; }
  await loadMe(); await loadPublic(); await vQuest(slug);
});
$("#footDiscord").innerHTML = CFG.discord ? `<a href="${esc(CFG.discord)}" target="_blank" rel="noopener">Discord</a>` : "";
window.addEventListener("hashchange", route);
refresh();
</script>
</body>
</html>
